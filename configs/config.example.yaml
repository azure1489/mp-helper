# 监听地址与端口
listen: ":8080"

# SQLite 文件路径
db_path: "./mp-helper.db"

# 管理接口 admin token（也可用环境变量 MP_HELPER_ADMIN_TOKEN 覆盖）
admin_token: "change-me-admin-token"

# access_token 缓存：v1 仅支持 memory
cache:
  type: "memory"

# 请求微信的全局超时（秒）
wechat_timeout_seconds: 30

# 每日统计存档：每天北京时间 time 把各公众号缺失或未定稿的统计数据补进本地库，
# 首次启用时从 2025-11-01 起逐日回补；max_calls 为每个公众号每次最多调用微信的次数。
archive:
  enabled: true
  time: "09:30"
  max_calls: 200
